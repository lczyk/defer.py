# not an installable package -- defer.py is meant to be vendored. this only holds
# the dev dependencies and tool config.

[dependency-groups]
dev = [
    "mypy>=1.14.1; python_version < '3.10'",
    "mypy>=2.3.1; python_version >= '3.10'",
    "pytest>=8.3.5; python_version < '3.10'",
    "pytest>=9.1.1; python_version >= '3.10'",
    "ruff>=0.15.15",
    #
]

[tool.ruff]
target-version = "py38"

[tool.mypy]
strict = true
files = [
    "defer.py",
    "test_defer.py",
    "example.py",
    "bench_defer.py",
    #
]
