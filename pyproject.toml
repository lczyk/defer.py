# not an installable package -- defer.py is meant to be vendored. this only holds
# the dev dependencies and tool config.

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.15.15",
    #
]

[tool.mypy]
strict = true
files = [
    "defer.py",
    "test_defer.py",
    "example.py",
    "bench_defer.py",
    #
]
